<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frogventure</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07150e;
  font-family:Georgia,serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:#fff;
}

#top{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 16px;
  font-weight:700;
  text-shadow:0 2px 4px #000;
}

.badge{
  background:rgba(0,0,0,.42);
  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;
  padding:7px 12px;
  font-size:14px;
}

#message{
  position:absolute;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  text-align:center;
  opacity:0;
  transition:opacity .2s;
  width:90%;
}

#message h1{
  font-size:42px;
  margin:0 0 8px;
  color:#ffd84a;
  text-shadow:
    0 4px 0 #552b05,
    0 6px 12px #000;
}

#message p{
  font-size:17px;
  margin:0;
}

#start,
#restart{
  pointer-events:auto;
  border:0;
  border-radius:22px;
  padding:13px 24px;
  font-size:18px;
  font-weight:800;
  background:#e6b83f;
  color:#3b2406;
  box-shadow:0 5px 0 #7a4c10;
  cursor:pointer;
}

#start{
  position:absolute;
  left:50%;
  top:78%;
  transform:translateX(-50%);
}

#restart{
  position:absolute;
  left:50%;
  top:78%;
  transform:translateX(-50%);
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

  <div id="top">
    <div class="badge">
      SCORE <span id="score">0</span>
    </div>

    <div class="badge">
      LEVEL <span id="level">1</span>
    </div>
  </div>

  <div id="message">
    <h1 id="msgTitle"></h1>
    <p id="msgText"></p>
  </div>

  <button id="start">PLAY</button>
  <button id="restart" class="hidden">PLAY AGAIN</button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");

const startBtn = document.getElementById("start");
const restartBtn = document.getElementById("restart");

const message = document.getElementById("message");
const msgTitle = document.getElementById("msgTitle");
const msgText = document.getElementById("msgText");


/* =========================
   GAME VARIABLES
========================= */

let W = 0;
let H = 0;
let dpr = 1;

let gameStarted = false;
let gameOver = false;

let level = 1;
let score = 0;
let combo = 0;

let frog = {
  x:0,
  y:0,
  angle:-Math.PI/2,
  current:0,
  next:0
};

let marbles = [];
let particles = [];
let shot = null;

let spawnClock = 0;

let aim = {
  x:0,
  y:0
};

const colors = [
  "#d93a35",
  "#e9c63d",
  "#3e9bd8",
  "#54b84b",
  "#a14db5",
  "#f07a35"
];


/* =========================
   RESIZE
========================= */

function resize(){

  dpr = Math.min(window.devicePixelRatio || 1,2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  frog.x = W / 2;
  frog.y = H * 0.56;

  if(!aim.x){
    aim.x = W / 2;
    aim.y = H * 0.2;
  }
}

window.addEventListener("resize",resize);

resize();


/* =========================
   PATH
========================= */

function pathLength(){

  return Math.max(
    600,
    Math.min(
      1150,
      W * 1.75
    )
  );

}


function pathPoint(t){

  const s =
    120 +
    t *
    (Math.min(W,H) * 0.00155);

  const cx = W / 2;

  return {

    x:
      cx +
      Math.sin(t * 0.012) * s +
      Math.sin(t * 0.025) * s * 0.35,

    y:
      H * 0.16 +
      t * 0.0021
  };

}


function makePath(){

  const points = [];

  for(
    let t = 0;
    t <= pathLength();
    t += 5
  ){

    points.push(
      pathPoint(t)
    );

  }

  return points;
}

let path = makePath();

window.addEventListener(
  "resize",
  ()=>{
    path = makePath();
  }
);


/* =========================
   MARBLES
========================= */

function randomColor(){

  return Math.floor(
    Math.random() *
    colors.length
  );

}


function createMarble(
  progress,
  color = randomColor()
){

  const p = pathPoint(progress);

  return {

    progress:progress,

    x:p.x,
    y:p.y,

    color:color,

    r:15
  };

}


/* =========================
   LEVEL RESET
========================= */

function resetLevel(){

  marbles = [];
  particles = [];

  shot = null;

  spawnClock = 0;

  combo = 0;

  frog.current = randomColor();
  frog.next = randomColor();


  const startingMarbles =
    10 +
    level * 2;


  for(
    let i = 0;
    i < startingMarbles;
    i++
  ){

    marbles.push(
      createMarble(
        -i * 31,
        randomColor()
      )
    );

  }

}


/* =========================
   START GAME
========================= */

function begin(){

  gameStarted = true;

  gameOver = false;

  startBtn.classList.add("hidden");

  restartBtn.classList.add("hidden");

  message.style.opacity = 0;

  level = 1;

  score = 0;

  scoreEl.textContent = "0";

  levelEl.textContent = "1";

  resetLevel();

  if(navigator.vibrate){
    navigator.vibrate(20);
  }

}


/* =========================
   GAME OVER
========================= */

function endGame(){

  gameOver = true;

  msgTitle.textContent =
    "GAME OVER";

  msgText.textContent =
    "The marbles reached the temple!";

  message.style.opacity = 1;

  restartBtn.classList.remove("hidden");

  if(navigator.vibrate){

    navigator.vibrate([
      80,
      50,
      120
    ]);

  }

}


/* =========================
   LEVEL COMPLETE
========================= */

function winLevel(){

  level++;

  levelEl.textContent =
    level;

  msgTitle.textContent =
    "LEVEL CLEAR!";

  msgText.textContent =
    "The ancient path opens...";

  message.style.opacity = 1;

  if(navigator.vibrate){

    navigator.vibrate([
      30,
      40,
      60
    ]);

  }


  setTimeout(
    ()=>{
      if(!gameOver){

        message.style.opacity = 0;

        resetLevel();

      }
    },
    1000
  );

}


/* =========================
   SHOOT
========================= */

function shoot(){

  if(
    !gameStarted ||
    gameOver ||
    shot
  ){

    return;

  }


  const dx =
    aim.x -
    frog.x;

  const dy =
    aim.y -
    frog.y;

  const len =
    Math.hypot(dx,dy) ||
    1;


  shot = {

    x:
      frog.x +
      Math.cos(frog.angle) *
      30,

    y:
      frog.y +
      Math.sin(frog.angle) *
      30,

    vx:
      dx / len *
      720,

    vy:
      dy / len *
      720,

    color:
      frog.current,

    r:11,

    life:1.8
  };


  frog.current =
    frog.next;

  frog.next =
    randomColor();


  if(navigator.vibrate){

    navigator.vibrate(8);

  }

}


/* =========================
   PARTICLE EFFECT
========================= */

function burst(
  x,
  y,
  color
){

  for(
    let i = 0;
    i < 14;
    i++
  ){

    const angle =
      Math.random() *
      Math.PI *
      2;

    const speed =
      60 +
      Math.random() *
      140;


    particles.push({

      x:x,
      y:y,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed,

      life:
        0.55 +
        Math.random() *
        0.35,

      size:
        2 +
        Math.random() *
        4,

      color:color

    });

  }

}


/* =========================
   MATCH CHECK
========================= */

function resolveMatches(index){

  if(!marbles.length){

    return;

  }


  let i =
    Math.max(
      0,
      Math.min(
        index,
        marbles.length - 1
      )
    );


  const color =
    marbles[i].color;


  let left = i;
  let right = i;


  while(
    left > 0 &&
    marbles[left - 1].color === color
  ){

    left--;

  }


  while(
    right < marbles.length - 1 &&
    marbles[right + 1].color === color
  ){

    right++;

  }


  const count =
    right -
    left +
    1;


  if(count >= 3){

    combo++;


    const gained =
      count *
      10 *
      combo;


    score += gained;

    scoreEl.textContent =
      score;


    for(
      let k = left;
      k <= right;
      k++
    ){

      burst(
        marbles[k].x,
        marbles[k].y,
        colors[color]
      );

    }


    marbles.splice(
      left,
      count
    );


    if(navigator.vibrate){

      navigator.vibrate(
        Math.min(
          80,
          15 +
          count * 8
        )
      );

    }


    if(
      left > 0 &&
      left < marbles.length &&
      marbles[left - 1].color ===
      marbles[left].color
    ){

      resolveMatches(left);

    }

  }
  else{

    combo = 0;

  }

}


/* =========================
   INSERT SHOT
========================= */

function insertShot(){

  let best =
    Infinity;

  let index =
    marbles.length;


  for(
    let i = 0;
    i < marbles.length;
    i++
  ){

    const distance =
      Math.hypot(
        shot.x -
        marbles[i].x,

        shot.y -
        marbles[i].y
      );


    if(distance < best){

      best = distance;

      index = i;

    }

  }


  let progress;


  if(index < marbles.length){

    progress =
      marbles[index].progress;

  }
  else if(marbles.length){

    progress =
      marbles[
        marbles.length - 1
      ].progress - 28;

  }
  else{

    progress = 0;

  }


  marbles.splice(
    index,
    0,
    {

      progress:progress,

      x:shot.x,

      y:shot.y,

      color:shot.color,

      r:15

    }
  );


  shot = null;


  resolveMatches(index);

}


/* =========================
   UPDATE
========================= */

function update(dt){

  if(
    !gameStarted ||
    gameOver
  ){

    return;

  }


  const speed =
    19 +
    level * 3.5;


  for(
    const marble of marbles
  ){

    marble.progress +=
      speed * dt;


    const p =
      pathPoint(
        marble.progress
      );


    marble.x =
      p.x;

    marble.y =
      p.y;

  }


  /* Keep marbles together */

  for(
    let i = 1;
    i < marbles.length;
    i++
  ){

    const gap =
      marbles[i].progress -
      marbles[i - 1].progress;


    if(gap < 29){

      marbles[i].progress =
        marbles[i - 1].progress +
        29;

    }

  }


  /* End zone */

  if(
    marbles.length &&
    marbles[
      marbles.length - 1
    ].progress >
    pathLength() - 15
  ){

    endGame();

    return;

  }


  /* Spawn new marbles */

  spawnClock += dt;


  const spawnEvery =
    Math.max(
      0.8,
      1.7 -
      level * 0.08
    );


  if(
    spawnClock >
      spawnEvery &&
    marbles.length < 65
  ){

    spawnClock = 0;


    marbles.unshift(
      createMarble(
        -30,
        randomColor()
      )
    );

  }


  /* Win */

  if(
    !shot &&
    marbles.length === 0
  ){

    winLevel();

  }


  /* Projectile */

  if(shot){

    shot.x +=
      shot.vx *
      dt;

    shot.y +=
      shot.vy *
      dt;


    shot.life -=
      dt;


    for(
      let i = 0;
      i < marbles.length;
      i++
    ){

      if(
        Math.hypot(
          shot.x -
          marbles[i].x,

          shot.y -
          marbles[i].y
        ) < 26
      ){

        insertShot();

        break;

      }

    }


    if(
      shot &&
      shot.life <= 0
    ){

      shot = null;

    }

  }


  /* Particles */

  for(
    const particle of particles
  ){

    particle.x +=
      particle.vx *
      dt;

    particle.y +=
      particle.vy *
      dt;

    particle.vy +=
      130 *
      dt;

    particle.life -=
      dt;

  }


  particles =
    particles.filter(
      p => p.life > 0
    );

}


/* =========================
   BACKGROUND
========================= */

function drawBackground(){

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );


  gradient.addColorStop(
    0,
    "#0b2b1b"
  );

  gradient.addColorStop(
    0.55,
    "#16452a"
  );

  gradient.addColorStop(
    1,
    "#06150d"
  );


  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* Ancient stones */

  ctx.globalAlpha =
    0.18;

  ctx.fillStyle =
    "#b5a36b";


  for(
    let y = 90;
    y < H;
    y += 70
  ){

    for(
      let x = -30;
      x < W;
      x += 100
    ){

      ctx.fillRect(
        x + (y % 140),
        y,
        92,
        54
      );

    }

  }


  ctx.globalAlpha = 1;


  /* Jungle vines */

  ctx.strokeStyle =
    "rgba(16,90,42,.7)";

  ctx.lineWidth = 6;


  for(
    let x = 0;
    x < W;
    x += 55
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.bezierCurveTo(
      x - 30,
      100,
      x + 45,
      170,
      x,
      250
    );

    ctx.stroke();

  }

}


/* =========================
   MARBLE PATH
========================= */

function drawPath(){

  ctx.lineWidth = 34;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.strokeStyle =
    "#5b4428";


  ctx.beginPath();


  let p =
    pathPoint(0);


  ctx.moveTo(
    p.x,
    p.y
  );


  for(
    let t = 5;
    t <= pathLength();
    t += 5
  ){

    p =
      pathPoint(t);


    ctx.lineTo(
      p.x,
      p.y
    );

  }


  ctx.stroke();


  ctx.lineWidth = 25;

  ctx.strokeStyle =
    "#2d2117";

  ctx.stroke();


  /* Skull */

  const end =
    pathPoint(
      pathLength()
    );


  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.arc(
    end.x,
    end.y,
    28,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle =
    "#d5c38b";

  ctx.font =
    "bold 18px Georgia";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "☠",
    end.x,
    end.y + 7
  );

}


/* =========================
   MARBLE DRAW
========================= */

function drawMarble(
  marble
){

  const gradient =
    ctx.createRadialGradient(
      marble.x - 5,
      marble.y - 6,
      2,
      marble.x,
      marble.y,
      marble.r
    );


  gradient.addColorStop(
    0,
    "#fff"
  );

  gradient.addColorStop(
    0.16,
    colors[marble.color]
  );

  gradient.addColorStop(
    1,
    "#24100c"
  );


  ctx.fillStyle =
    gradient;


  ctx.beginPath();

  ctx.arc(
    marble.x,
    marble.y,
    marble.r,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.strokeStyle =
    "rgba(255,255,255,.3)";

  ctx.lineWidth = 1;

  ctx.stroke();

}


/* =========================
   FROG
========================= */

function drawFrog(){

  ctx.save();


  ctx.translate(
    frog.x,
    frog.y
  );


  ctx.rotate(
    frog.angle
  );


  /* Shadow */

  ctx.fillStyle =
    "rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    19,
    38,
    15,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* Frog body */

  ctx.fillStyle =
    "#49a63c";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    28,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle =
    "#27732a";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    23,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* Eyes */

  for(
    const eyeX of [-11,11]
  ){

    ctx.fillStyle =
      "#54b83f";

    ctx.beginPath();

    ctx.arc(
      eyeX,
      -22,
      10,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#111";

    ctx.beginPath();

    ctx.arc(
      eyeX,
      -23,
      4,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  /* Mouth */

  ctx.strokeStyle =
    "#143a18";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.arc(
    0,
    5,
    14,
    0,
    Math.PI
  );

  ctx.stroke();


  /* Current marble */

  const current =
    ctx.createRadialGradient(
      -5,
      -7,
      1,
      0,
      0,
      14
    );


  current.addColorStop(
    0,
    "#fff"
  );

  current.addColorStop(
    0.18,
    colors[frog.current]
  );

  current.addColorStop(
    1,
    "#200"
  );


  ctx.fillStyle =
    current;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    14,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* Next marble */

  ctx.rotate(
    -frog.angle
  );


  ctx.fillStyle =
    "rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.arc(
    0,
    44,
    11,
    0,
    Math.PI * 2
  );

  ctx.fill();


  const next =
    ctx.createRadialGradient(
      -3,
      40,
      1,
      0,
      44,
      11
    );


  next.addColorStop(
    0,
    "#fff"
  );

  next.addColorStop(
    0.2,
    colors[frog.next]
  );

  next.addColorStop(
    1,
    "#200"
  );


  ctx.fillStyle =
    next;

  ctx.beginPath();

  ctx.arc(
    0,
    44,
    11,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.restore();

}


/* =========================
   DRAW EVERYTHING
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawBackground();

  drawPath();


  for(
    const marble of marbles
  ){

    drawMarble(
      marble
    );

  }


  /* Flying shot */

  if(shot){

    const gradient =
      ctx.createRadialGradient(
        shot.x - 4,
        shot.y - 5,
        1,
        shot.x,
        shot.y,
        shot.r
      );


    gradient.addColorStop(
      0,
      "#fff"
    );

    gradient.addColorStop(
      0.2,
      colors[shot.color]
    );

    gradient.addColorStop(
      1,
      "#200"
    );


    ctx.fillStyle =
      gradient;


    ctx.beginPath();

    ctx.arc(
      shot.x,
      shot.y,
      shot.r,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  /* Particles */

  for(
    const particle of particles
  ){

    ctx.globalAlpha =
      Math.max(
        0,
        particle.life
      );


    ctx.fillStyle =
      particle.color;


    ctx.beginPath();

    ctx.arc(
      particle.x,
      particle.y,
      particle.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  ctx.globalAlpha = 1;


  drawFrog();

}


/* =========================
   TOUCH / MOUSE AIM
========================= */

function pointerPosition(e){

  const touch =
    e.touches
      ? e.touches[0]
      : e;


  aim.x =
    touch.clientX;

  aim.y =
    touch.clientY;


  frog.angle =
    Math.atan2(
      aim.y - frog.y,
      aim.x - frog.x
    );

}


/* =========================
   CONTROLS
========================= */

canvas.addEventListener(
  "pointermove",
  pointerPosition
);


canvas.addEventListener(
  "pointerdown",
  e => {

    pointerPosition(e);

    shoot();

  }
);


canvas.addEventListener(
  "touchstart",
  e => {

    e.preventDefault();

    pointerPosition(e);

    shoot();

  },
  {
    passive:false
  }
);


startBtn.onclick =
  begin;

restartBtn.onclick =
  begin;


/* =========================
   GAME LOOP
========================= */

let last = 0;


function loop(time){

  const dt =
    Math.min(
      0.033,
      (time - last) / 1000 || 0
    );


  last = time;


  update(dt);

  draw();


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);
